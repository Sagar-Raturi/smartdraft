{% extends "blog/base.html" %}
{% load crispy_forms_tags %}
{% load socialaccount %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

        <div class="content-section login-card">

            <!-- Login Form -->
            <form method="POST">

                {% csrf_token %}

                <fieldset class="form-group">

                    <legend class="login-title border-bottom mb-4 pb-3">
                        Login
                    </legend>

                    {{ form|crispy }}

                </fieldset>


                <!-- Login Actions -->
                <div class="login-actions">

                    <button
                        class="btn btn-outline-info login-btn"
                        type="submit">

                        Login

                    </button>

                    <a
                        href="#"
                        class="forgot-password">

                        Forgot Password?

                    </a>

                </div>

            </form>


            <!-- Sign Up -->
            <div class="signup-section">

                <small class="text-muted">

                    Need an account?

                    <a
                        href="{% url 'register' %}"
                        class="signup-link">

                        Sign Up Now

                    </a>

                </small>

            </div>


            <!-- OR Divider -->
            <div class="social-divider">
                <span>OR</span>
            </div>


            <!-- Social Login -->
            <div class="social-login">


                <!-- Google -->
                <a
                    href="{% provider_login_url 'google' %}"
                    class="social-btn">

                    <span class="social-icon google-icon">

                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 48 48">

                            <path
                                fill="#FFC107"
                                d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>

                            <path
                                fill="#FF3D00"
                                d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>

                            <path
                                fill="#4CAF50"
                                d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>

                            <path
                                fill="#1976D2"
                                d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>

                        </svg>

                    </span>

                    <span>Continue with Google</span>

                </a>


                <!-- GitHub -->
                <a
                    href="{% provider_login_url 'github' %}"
                    class="social-btn">

                    <span class="social-icon">

                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24">

                            <path
                                fill="currentColor"
                                d="M12 2C6.477 2 2 6.477 2 12c0 4.419 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-1.024-.014-1.858-2.782.604-3.369-1.189-3.369-1.189-.455-1.157-1.11-1.465-1.11-1.465-.908-.62.069-.608.069-.608 1.003.071 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.091-.646.349-1.087.636-1.337-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0 1 12 6.844a9.56 9.56 0 0 1 2.504.337c1.909-1.294 2.748-1.025 2.748-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.744 0 .268.18.58.688.481A10.001 10.001 0 0 0 22 12c0-5.523-4.477-10-10-10z"/>

                        </svg>

                    </span>

                    <span>Continue with GitHub</span>

                </a>


                <!-- X -->
                <a
                    href="{% provider_login_url 'twitter_oauth2' %}"
                    class="social-btn">

                    <span class="social-icon">

                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 50 50">

                            <path
                                fill="currentColor"
                                d="M5.92 6 20.58 27.38 6.23 44h3.18l12.58-14.58L31.99 44H44L28.68 21.67 42.2 6h-3.17L27.28 19.62 17.93 6H5.92zM9.72 8h7.16l23.32 34h-7.16L9.72 8z"/>

                        </svg>

                    </span>

                    <span>Continue with X</span>

                </a>


                <!-- Facebook -->
                <a
                    href="#"
                    class="social-btn">

                    <span class="social-icon facebook-icon">

                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24">

                            <path
                                fill="currentColor"
                                d="M22 12.07C22 6.48 17.52 2 12 2S2 6.48 2 12.07c0 5.02 3.66 9.18 8.44 9.93v-7.03h-2.5v-2.9h2.5V9.41c0-2.46 1.49-3.82 3.74-3.82 1.08 0 2.2.19 2.2.19v2.42h-1.24c-1.22 0-1.6.76-1.6 1.54v1.84h2.72l-.44 2.9h-2.28v7.03c4.78-.75 8.44-4.91 8.44-9.93z"/>

                        </svg>

                    </span>

                    <span>Continue with Facebook</span>

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock content %}
