{% extends "blog/base.html" %}
{% load crispy_forms_tags %}
{% load static %}

{% block content %}
<!-- Font Awesome (icons used by the EasyMDE toolbar) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<!-- EasyMDE (pinned version -- an unpinned CDN URL can change under us) -->
<link rel="stylesheet" href="https://unpkg.com/easymde@2.20.0/dist/easymde.min.css">

<link rel="stylesheet" href="{% static 'css/editor.css' %}">

<div class="content-section"
     id="post-editor-root"
     data-upload-endpoint="{% url 'upload-image' %}"
     data-preview-endpoint="{% url 'render-preview' %}"
     data-autosave-id="post-draft-{{ object.pk|default:'new' }}">
    <form method="POST">
        {% csrf_token %}

        <fieldset class="form-group">
            <legend class="border-bottom mb-3">Blog Post</legend>
            {{ form|crispy }}
        </fieldset>

        <div id="editor-status-bar" class="editor-status-bar"></div>
        <div id="editor-error" class="alert alert-danger d-none mt-2" role="alert"></div>

        <div class="form-group mt-3">
            <button class="btn btn-outline-info" type="submit">Post</button>
        </div>
    </form>
</div>

<script src="https://unpkg.com/easymde@2.20.0/dist/easymde.min.js"></script>
<script src="{% static 'js/editor.js' %}"></script>

{% endblock content %}
